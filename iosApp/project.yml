name: TrueFind
options:
  bundleIdPrefix: com.truefind
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TrueFind:
    type: application
    platform: iOS
    sources:
      - path: TrueFind
      - path: SharedBridge
    info:
      path: TrueFind/Info.plist
    entitlements:
      path: TrueFind/TrueFind.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.truefind.app
        INFOPLIST_FILE: TrueFind/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrueFind/TrueFind.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../shared/build/XCFrameworks/release"
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/TrueFindShared.xcframework
        embed: false
      - target: TrueFindShareExtension

  TrueFindShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TrueFindShareExtension
      - path: SharedBridge
      - path: TrueFind/ChooserSheetView.swift
    info:
      path: TrueFindShareExtension/Info.plist
    entitlements:
      path: TrueFindShareExtension/TrueFindShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.truefind.app.ShareExtension
        INFOPLIST_FILE: TrueFindShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrueFindShareExtension/TrueFindShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../shared/build/XCFrameworks/release"
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/TrueFindShared.xcframework
        embed: false
