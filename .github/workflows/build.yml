name: TrueFind CI (Android & iOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    name: Shared Tests & Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run shared & Android unit tests and build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:assembleDebug

      - name: Audit merged Android manifest (Google Play compliance)
        run: |
          MANIFEST="androidApp/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml"
          if grep -E "INTERNET|ACCESSIBILITY|QUERY_ALL_PACKAGES|READ_MEDIA_IMAGES|WRITE_EXTERNAL_STORAGE|RECORD_AUDIO" "$MANIFEST"; then
            echo "ERROR: Forbidden permission found in merged manifest!"
            exit 1
          fi
          echo "PASS: Merged manifest contains zero forbidden permissions."

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TrueFind-Android-Debug-APK
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk

  ios:
    name: Shared XCFramework & iOS Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run shared iOS simulator tests & build TrueFindShared.xcframework
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:iosSimulatorArm64Test :shared:assembleTrueFindSharedReleaseXCFramework

      - name: Install XcodeGen and generate TrueFind.xcodeproj
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate

      - name: Build iOS App & Share Extension (Simulator arm64, unsigned CI verification)
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild \
            -project TrueFind.xcodeproj \
            -scheme TrueFind \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee sim_build.log || {
              grep -E "ld:|Undefined|error:|BUILD FAILED" sim_build.log | head -n 40 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Build unsigned iOS Device IPA (for Sideloadly / AltStore / re-signing)
        run: |
          cd iosApp
          set -o pipefail
          xcodebuild \
            -project TrueFind.xcodeproj \
            -scheme TrueFind \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/device \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee device_build.log || {
              grep -E "ld:|Undefined|error:|BUILD FAILED" device_build.log | head -n 40 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/TrueFind.app build/ipa/Payload/
          cd build/ipa && zip -r ../TrueFind-iOS-unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueFind-iOS-Unsigned-IPA
          path: iosApp/build/TrueFind-iOS-unsigned.ipa
